<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd3b8" />
      <stop offset="100%" stop-color="#f59e6b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle for PWA maskable/any -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Cloud decorative elements in background -->
  <path d="M70 380 Q90 340 130 350 Q160 320 200 350 Q230 350 250 380 Z" fill="#ffffff" opacity="0.25" />
  <path d="M300 160 Q320 130 360 140 Q390 110 430 140 Q450 140 460 160 Z" fill="#ffffff" opacity="0.25" />

  <!-- Wings behind/side of head -->
  <!-- Left Wing -->
  <g filter="url(#dropGlow)">
    <path d="M140 250 C80 220 50 150 100 130 C130 120 160 170 170 230 Z" fill="url(#wingGrad)" stroke="#cbd5e1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M110 200 C80 180 80 145 110 145 C125 145 140 175 145 210 Z" fill="#f8fafc" />
    <!-- Right Wing -->
    <path d="M372 250 C432 220 462 150 412 130 C382 120 352 170 342 230 Z" fill="url(#wingGrad)" stroke="#cbd5e1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M402 200 C432 180 432 145 402 145 C387 145 372 175 367 210 Z" fill="#f8fafc" />
  </g>

  <!-- Hasnain Character Head -->
  <!-- Ears -->
  <circle cx="178" cy="275" r="22" fill="#f59e6b" stroke="#e07a42" stroke-width="3" />
  <circle cx="178" cy="275" r="12" fill="#e07a42" opacity="0.4" />
  <circle cx="334" cy="275" r="22" fill="#f59e6b" stroke="#e07a42" stroke-width="3" />
  <circle cx="334" cy="275" r="12" fill="#e07a42" opacity="0.4" />

  <!-- Face Shape: Rounded, friendly proportions -->
  <path d="M185 240 C185 180 327 180 327 240 C327 315 315 355 256 355 C197 355 185 315 185 240 Z" fill="url(#skinGrad)" stroke="#e07a42" stroke-width="4" filter="url(#dropGlow)" />

  <!-- Dark Voluminous Hair (Puffy, textured top & sides) -->
  <path d="M172 230 C162 190 170 140 215 120 C235 110 277 110 297 120 C342 140 350 190 340 230 C332 205 310 185 256 185 C202 185 180 205 172 230 Z" fill="url(#hairGrad)" />
  <path d="M195 140 C220 115 292 115 317 140 C335 160 320 180 305 180 C275 180 265 165 240 170 C220 174 208 178 195 140 Z" fill="#334155" opacity="0.4" />

  <!-- Natural Eyebrows -->
  <path d="M210 232 Q230 224 242 232" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M270 232 Q282 224 302 232" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <!-- Expressive Brown Eyes -->
  <ellipse cx="226" cy="254" rx="13" ry="15" fill="#ffffff" />
  <ellipse cx="227" cy="254" rx="8.5" ry="9.5" fill="#451a03" />
  <circle cx="229" cy="250" r="3.5" fill="#ffffff" />
  <circle cx="224" cy="256" r="1.5" fill="#ffffff" />

  <ellipse cx="286" cy="254" rx="13" ry="15" fill="#ffffff" />
  <ellipse cx="285" cy="254" rx="8.5" ry="9.5" fill="#451a03" />
  <circle cx="287" cy="250" r="3.5" fill="#ffffff" />
  <circle cx="282" cy="256" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M256 257 Q258 274 252 278 Q258 281 262 278" stroke="#d97736" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cheerful rosy cheeks -->
  <ellipse cx="204" cy="282" rx="10" ry="6" fill="#f43f5e" opacity="0.3" />
  <ellipse cx="308" cy="282" rx="10" ry="6" fill="#f43f5e" opacity="0.3" />

  <!-- Pink Lips / Confident Smile -->
  <path d="M236 304 Q256 324 276 304" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round" fill="#fda4af" />
  <path d="M242 305 Q256 313 270 305" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Gold Star / Coin Accent -->
  <g transform="translate(370, 70) scale(0.7)">
    <circle cx="50" cy="50" r="42" fill="#fbbf24" stroke="#d97706" stroke-width="6" />
    <polygon points="50,22 59,40 79,42 64,56 68,76 50,65 32,76 36,56 21,42 41,40" fill="#fef08a" />
  </g>
</svg>
